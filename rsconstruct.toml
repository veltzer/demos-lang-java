# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.python]

[processor.ruff]
src_dirs = ["src", "scripts", "exercises"]

[processor.pylint]
src_dirs = ["src", "scripts", "exercises"]

[processor.mypy]
src_dirs = ["src", "scripts", "exercises"]

[processor.requirements]
src_dirs = ["src", "scripts"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src", "exercises"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile compiled all src/**/*.java together with
# `javac -Werror -Xlint:all <sources> -d out/classes` (one batched build --
# the types reference each other). scripts/javac_build.py runs that exact
# command; the explicit processor triggers it on any .java change. DO_IVY was 0,
# so the ivy dependency-fetch step was off and is not reproduced.
[processor.explicit.java]
command = "scripts/javac_build.py"
input_globs = ["src/**/*.java"]
output_dirs = ["out/classes"]
