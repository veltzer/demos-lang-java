# rsconstruct build configuration for this repository.

[analyzer.python]

[processor.ruff]
src_dirs = ["src", "scripts", "exercises"]

[processor.pylint]
src_dirs = ["src", "scripts", "exercises"]

[processor.mypy]
src_dirs = ["src", "scripts", "exercises"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src", "exercises", "to_integrate/AspectJ/scripts"]
src_files = ["build_maven.sh"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src", "to_integrate/RcpView/html"]

[processor.tidy]
src_dirs = ["src"]

# ─── repo-specific configuration ────────────────────────────────────────────

# The Makefile compiled all src/**/*.java together with
# `javac -Werror -Xlint:all <sources> -d out/classes` (one batched build --
# the types reference each other). scripts/javac_build.py runs that exact
# command; the explicit processor triggers it on any .java change. DO_IVY was 0,
# so the ivy dependency-fetch step was off and is not reproduced.
[processor.explicit.java]
command = "scripts/javac_build.py"
input_globs = ["src/**/*.java"]
output_dirs = ["out/classes"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_files = ["README.md"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["ivy", "resources/Standard/src/johnbryce/lab5", "src/main/resources", "support", "to_integrate"]
src_files = ["build_bootstrap.xml", "ivysettings.xml"]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checkstyle]
src_dirs = ["jit", "src/main/java", "to_integrate"]
args = ["-c", "checkstyle.xml"]

# ─── css ─────────────────────────────────────────────────────────────────────

[processor.stylelint]
src_dirs = ["to_integrate/Jsf/resources/jsf/examples/webapp"]
